<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - CoachIA</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>Connexion</h2>
      <p class="subtitle">Bienvenue ! Connecte-toi pour continuer.</p>
      
      <div class="error" id="loginError" style="display:none;"></div>
      
      <div style="padding: 12px; background: #fef3c7; border-left: 4px solid #f59e0b; border-radius: 4px; margin-bottom: 16px; font-size: 0.9rem; color: #92400e;">
        <strong>📌 Mode Démo:</strong> Utilise n'importe quels identifiants pour continuer.
      </div>
      
      <form id="loginForm">
        <div class="field">
          <label class="label" for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="yahya.kh@example.com" required />
        </div>

        <div class="field">
          <label class="label" for="loginPassword">Mot de passe</label>
          <div class="input-wrap">
            <input type="password" id="loginPassword" placeholder="Ton mot de passe" required />
            <button type="button" class="toggle-btn" id="togglePassword">Afficher</button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">Se connecter</button>
      </form>

      <div class="toggle-mode">
        Pas de compte ? <a href="signup.html" id="showSignup">S'inscrire</a>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
