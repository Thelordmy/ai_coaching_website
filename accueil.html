<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil - CoachIA</title>
  <link rel="stylesheet" href="css/accueil.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"> <a href="index.html">CoachIA</a></div>
      <button class="toggle-sidebar-btn" id="toggleSidebar">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    
    <nav class="sidebar-nav">
      <a href="accueil.html" class="nav-item active">
        <i class="fas fa-home icon"></i>
        <span>Accueil</span>
      </a>
      <a href="chat.html" class="nav-item">
        <i class="fas fa-comments icon"></i>
        <span>Chat IA</span>
      </a>
      <a href="workouts.html" class="nav-item">
        <i class="fas fa-dumbbell icon"></i>
        <span>Entraînements</span>
      </a>
      <a href="nutrition.html" class="nav-item">
        <i class="fas fa-utensils icon"></i>
        <span>Nutrition</span>
      </a>
      <a href="progress.html" class="nav-item">
        <i class="fas fa-chart-line icon"></i>
        <span>Progrès</span>
      </a>
      <a href="settings.html" class="nav-item">
        <i class="fas fa-cog icon"></i>
        <span>Paramètres</span>
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <a href="profile.html" class="nav-item">
        <i class="fas fa-user icon"></i>
        <span>Profil</span>
      </a>
      <a href="index.html" class="nav-item">
        <i class="fas fa-sign-out-alt icon"></i>
        <span>Déconnexion</span>
      </a>
    </div>
  </aside>
  
  <!-- Main content area -->
  <main class="main-content">
    <!-- Toggle Button (appears when sidebar is closed) -->
    <button class="toggle-sidebar-btn-fixed" id="toggleSidebarFixed">
      <i class="fas fa-bars"></i>
    </button>
    
    <div class="welcome-section">
      <h1>Bienvenue, Yahya! </h1>
      <p class="subtitle">Prêt à atteindre tes objectifs aujourd'hui ?</p>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
      <div class="stat-card" data-progress="75">
        <i class="fas fa-bullseye stat-icon"></i>
        <div class="stat-info">
          <h3>75%</h3>
          <p>Objectif atteint</p>
          <div class="stat-progress">
            <div class="stat-progress-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Today's Workout -->
    <div class="section-card">
      <h2>Entraînement d'aujourd'hui</h2>
      <div class="workout-preview">
        <div class="workout-info">
          <h3>Journée des jambes</h3>
          <p>6 exercices • 45 minutes • Intermédiaire</p>
        </div>
      </div>
    </div>

    <!-- Nutrition summary removed (site is informational, not a tracker) -->

    <!-- Quick Actions (kept only conversational action) -->
    <div class="quick-actions">
      <button class="action-btn">
        <i class="fas fa-comments"></i>
        <span>Parler au coach IA</span>
      </button>
    </div>
  </main>

  <script src="js/accueil.js"></script>
</body>
</html>
