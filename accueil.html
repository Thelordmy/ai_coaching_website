<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil - CoachIA</title>
  <link rel="stylesheet" href="css/accueil.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
  <!-- Mobile Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"> <a href="index.html">CoachIA</a></div>
      <button class="toggle-sidebar-btn" id="toggleSidebar">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    
    <nav class="sidebar-nav">
      <a href="accueil.html" class="nav-item active">
        <i class="fas fa-home icon"></i>
        <span>Accueil</span>
      </a>
      <a href="chat.html" class="nav-item">
        <i class="fas fa-comments icon"></i>
        <span>Chat IA</span>
      </a>
      <a href="workouts.html" class="nav-item">
        <i class="fas fa-dumbbell icon"></i>
        <span>Entraînements</span>
      </a>
      <a href="nutrition.html" class="nav-item">
        <i class="fas fa-utensils icon"></i>
        <span>Nutrition</span>
      </a>
      <a href="progress.html" class="nav-item">
        <i class="fas fa-chart-line icon"></i>
        <span>Progrès</span>
      </a>
      <a href="settings.html" class="nav-item">
        <i class="fas fa-cog icon"></i>
        <span>Paramètres</span>
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <a href="profile.html" class="nav-item">
        <i class="fas fa-user icon"></i>
        <span>Profil</span>
      </a>
      <a href="index.html" class="nav-item">
        <i class="fas fa-sign-out-alt icon"></i>
        <span>Déconnexion</span>
      </a>
    </div>
  </aside>
  
  <!-- Main content area -->
  <main class="main-content">
    <!-- Toggle Button (appears when sidebar is closed) -->
    <button class="toggle-sidebar-btn-fixed" id="toggleSidebarFixed">
      <i class="fas fa-bars"></i>
    </button>
    
    <div class="welcome-section">
      <h1 id="welcomeName">Bienvenue!</h1>
      <p class="subtitle">Prêt à atteindre tes objectifs aujourd'hui ?</p>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Today's Workout -->
    <div class="section-card">
      <h2>Entraînements</h2>
      <div id="workoutSection"></div>
    </div>

    <!-- Log Workout Button -->
    <div class="quick-actions">
      <button class="action-btn" onclick="window.location.href='workout-log.html'">
        <i class="fas fa-plus-circle"></i>
        <span>Journaliser une séance</span>
      </button>
      <button class="action-btn" onclick="window.location.href='chat.html'">
        <i class="fas fa-comments"></i>
        <span>Parler au coach IA</span>
      </button>
    </div>
  </main>

  <script src="js/accueil.js"></script>
  <script src="js/user-data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
