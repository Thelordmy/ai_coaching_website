<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat IA - CoachIA</title>
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Sidebar (copied from accueil for consistency) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"> <a href="index.html">CoachIA</a></div>
      <button class="toggle-sidebar-btn" id="toggleSidebar">
        <i class="fas fa-bars"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="accueil.html" class="nav-item">
        <i class="fas fa-home icon"></i>
        <span>Accueil</span>
      </a>
      <a href="chat.html" class="nav-item active">
        <i class="fas fa-comments icon"></i>
        <span>Chat IA</span>
      </a>
      <a href="workouts.html" class="nav-item">
        <i class="fas fa-dumbbell icon"></i>
        <span>Entraînements</span>
      </a>
      <a href="nutrition.html" class="nav-item">
        <i class="fas fa-utensils icon"></i>
        <span>Nutrition</span>
      </a>
      <a href="progress.html" class="nav-item">
        <i class="fas fa-chart-line icon"></i>
        <span>Progrès</span>
      </a>
      <a href="settings.html" class="nav-item">
        <i class="fas fa-cog icon"></i>
        <span>Paramètres</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="profile.html" class="nav-item">
        <i class="fas fa-user icon"></i>
        <span>Profil</span>
      </a>
      <a href="index.html" class="nav-item">
        <i class="fas fa-sign-out-alt icon"></i>
        <span>Déconnexion</span>
      </a>
    </div>
  </aside>

  <main class="main-content">
    <button class="toggle-sidebar-btn-fixed" id="toggleSidebarFixed">
      <i class="fas fa-bars"></i>
    </button>

    <div class="section-card" style="padding:16px 20px; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2>Chat IA</h2>
        <p class="subtitle">Pose une question au coach IA — réponses instantanées.</p>
      </div>
      <button id="clearHistoryBtn" style="padding: 10px 16px; background: #fee2e2; color: #991b1b; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 200ms; margin-left: 16px;" onclick="clearChatHistory()">Effacer l'historique</button>
    </div>

    <section class="chat-container section-card">
      <div class="chat-window" id="chatWindow" aria-live="polite"></div>
      
      <button id="scrollToBottomBtn" class="scroll-to-bottom-btn" style="display: none;">
        <i class="fas fa-arrow-down"></i>
      </button>

      <form id="chatForm" class="chat-form" autocomplete="off">
        <input id="chatInput" class="chat-input" type="text" placeholder="Écris un message..." required />
        <button type="submit" class="btn-primary chat-send"><i class="fas fa-paper-plane"></i></button>
      </form>
    </section>
  </main>

  <script src="js/accueil.js"></script>
  <script src="js/user-data.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
